name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ready:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Require deployment readiness
        env:
          DEPLOYMENT_READY: ${{ vars.DEPLOYMENT_READY }}
        run: |
          if [ "$DEPLOYMENT_READY" != "true" ]; then
            echo "::error::Complete docs/ci-deploy.md and set production DEPLOYMENT_READY=true."
            exit 1
          fi
  checks:
    needs: ready
    uses: ./.github/workflows/quality.yml
  deploy:
    needs: [ready, checks]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Deploy checked revision
        env:
          WRANGLER_SEND_METRICS: 'false'
          DEPLOYMENT_READY: ${{ vars.DEPLOYMENT_READY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$DEPLOYMENT_READY" = "true"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing production Cloudflare credentials."
            exit 1
          fi
          pnpm run deploy
